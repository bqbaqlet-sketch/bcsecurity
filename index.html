<title>Tolqyn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column (max 460px) centered on wide screens; five bottom tabs; forms and details rise as bottom sheets. */
:root{
  --bg:#F2F4FA;--surface:#FFFFFF;--surface2:#E8ECF7;--fg:#0E1430;--muted:#5C6584;--line:#DCE1EE;
  --accent:#3340E8;--accent-fg:#FFFFFF;--accent-soft:#E3E6FF;
  --good:#0C8A5E;--good-soft:#D9F4E8;--bad:#C23A3A;--bad-soft:#FBE3E3;--warn:#A86A0A;--warn-soft:#FCEFD4;
  --hero-a:#3340E8;--hero-b:#161C6B;
  --c1:#5B6CFF;--c2:#12B98A;--c3:#F2A93B;--c4:#F0627A;--c5:#8F9BBB;
  --shadow:0 1px 2px rgba(14,20,48,.06),0 8px 24px rgba(14,20,48,.06);
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Unbounded','Onest',system-ui,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0E1D;--surface:#131A31;--surface2:#1B2342;--fg:#ECEFFA;--muted:#96A0C2;--line:#242D50;
  --accent:#8C97FF;--accent-fg:#0A0E1D;--accent-soft:#1F2760;
  --good:#4CD8A2;--good-soft:#12362B;--bad:#FF8484;--bad-soft:#3A1B22;--warn:#F0B35A;--warn-soft:#3A2D12;
  --hero-a:#4654FF;--hero-b:#0F1450;--shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E1D;--surface:#131A31;--surface2:#1B2342;--fg:#ECEFFA;--muted:#96A0C2;--line:#242D50;
  --accent:#8C97FF;--accent-fg:#0A0E1D;--accent-soft:#1F2760;
  --good:#4CD8A2;--good-soft:#12362B;--bad:#FF8484;--bad-soft:#3A1B22;--warn:#F0B35A;--warn-soft:#3A2D12;
  --hero-a:#4654FF;--hero-b:#0F1450;--shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;background:var(--bg);color:var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:460px;margin:0 auto;padding-bottom:110px}
.screen{display:flex;flex-direction:column;gap:14px}

/* header */
.hdr{display:flex;align-items:center;gap:12px;padding:14px 0 2px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:600 17px var(--f-disp);flex:none}
.hdr .who{min-width:0;flex:1}
.hdr h1{font:600 17px/1.2 var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--muted);background:var(--surface2);padding:3px 10px 3px 4px;border-radius:999px}
.plus b{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:1px 7px;font-size:11px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
.iconbtn svg{width:22px;height:22px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pt{font:600 26px/1.1 var(--f-disp);padding:18px 0 4px}

/* stories */
.stories{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 118px;height:130px;border-radius:20px;padding:12px;position:relative;overflow:hidden;color:#fff;font-weight:600;font-size:13px;line-height:1.25;display:flex;align-items:flex-start}
.story svg{position:absolute;right:-6px;bottom:-6px;width:70px;height:70px;opacity:.9;color:#fff}
.st1{background:linear-gradient(150deg,#3340E8,#161C6B)}.st2{background:linear-gradient(150deg,#0E9F76,#0A4D5C)}.st3{background:linear-gradient(150deg,#E8883A,#B83C5A)}.st4{background:linear-gradient(150deg,#7A4DE0,#2E2A8C)}

/* bank card */
.bankcard{border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--hero-a),var(--hero-b))}
.bankcard .waves{position:absolute;inset:auto -10px -20px auto;width:260px;opacity:.28;pointer-events:none}
.bankcard .lbl{font-size:13px;opacity:.8;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bankcard .bal{font:600 30px/1.15 var(--f-disp);margin:8px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bankcard .num{font-size:13px;opacity:.85;display:flex;gap:10px;align-items:center}
.bankcard .eyebtn{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.bankcard .eyebtn svg{width:20px;height:20px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.act i{width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.act svg{width:22px;height:22px}

/* surfaces */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.tight{padding:6px 16px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.sec h2{font-size:18px;font-weight:700}
.link{color:var(--accent);font-weight:600;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.mini b{font-size:16px}.mini small{color:var(--muted);font-size:13px}
.bars{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:3px;margin-top:10px;background:var(--surface2)}
.bars i{display:block;height:100%;min-width:6px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;white-space:nowrap;flex:none}
.pill svg{width:20px;height:20px;color:var(--accent)}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.ico.good{background:var(--good-soft);color:var(--good)}.ico.bad{background:var(--bad-soft);color:var(--bad)}.ico.warn{background:var(--warn-soft);color:var(--warn)}
.row .tx{min-width:0;flex:1}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.row .r{margin-left:auto;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:6px}
.row .r.pos{color:var(--good)}
.row .chev{color:var(--muted);width:18px;height:18px;flex:none}
.day{font-weight:700;font-size:14px;color:var(--muted);padding:10px 0 0}

/* grid tiles */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;text-align:center;position:relative;min-width:0;line-height:1.2}
.tile .ico{width:58px;height:58px;border-radius:19px}
.tile .ico svg{width:27px;height:27px}
.tag{position:absolute;top:-6px;right:0;background:var(--good);color:var(--accent-fg);font-size:10px;font-weight:700;padding:2px 6px;border-radius:9px}
.tag.new{background:var(--bad);color:#fff}
.rates .rh,.rates .rr{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;align-items:center;padding:9px 0;font-variant-numeric:tabular-nums}
.rates .rh{color:var(--muted);font-size:13px;padding-top:2px}
.rates .rr{border-top:1px solid var(--line)}
.rates .rr b{font-weight:600}.rates .rr span:not(:first-child){text-align:right}.rates .rh span:not(:first-child){text-align:right}

/* controls */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;font-weight:600;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;font-weight:500;flex:none}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.amount{font:600 28px var(--f-disp);text-align:center;padding:16px 10px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.hint.err{color:var(--bad)}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px;text-align:center}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 14px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{background:none;border:0;padding:13px 0}
.note{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:13px}
.note.good{background:var(--good-soft);color:var(--good)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,10,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0 max(0px,env(safe-area-inset-left,0px)) 0 max(0px,env(safe-area-inset-right,0px));animation:fade .15s}
.sheet{width:100%;max-width:460px;max-height:92%;background:var(--bg);border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:rise .22s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font:600 20px/1.2 var(--f-disp);margin-bottom:4px}
.sheet .sub{color:var(--muted);margin-bottom:16px}
.sheet .xbtn{position:absolute}
.ok{width:76px;height:76px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center;margin:10px auto 14px}
.ok svg{width:38px;height:38px}
.center{text-align:center}
.big{font:600 26px var(--f-disp);font-variant-numeric:tabular-nums}
.rc{background:var(--surface);border-radius:18px;padding:4px 16px;margin:16px 0}
.rc div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.rc div:last-child{border-bottom:0}
.rc dt,.rc span:first-child{color:var(--muted)}
.rc span:last-child{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;padding:4px 0 10px}
.msg{max-width:82%;padding:10px 13px;border-radius:16px;background:var(--surface);align-self:flex-start;line-height:1.35;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg)}
.sendrow{display:flex;gap:8px}.sendrow .btn{width:auto;padding:0 18px}

/* qr */
.qr{display:grid;gap:0;width:208px;max-width:100%;aspect-ratio:1;margin:8px auto;padding:12px;background:#fff;border-radius:18px}
.qr i{background:#0E1430}.qr i.w{background:#fff}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-right,0px));z-index:30}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);max-width:460px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:500;color:var(--muted);min-width:0}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:90;max-width:min(420px,calc(100% - 32px));font-weight:500;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lang{font:700 12px var(--f-body);width:auto;padding:0 12px}
.meter{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;border-radius:5px}
.afhead{display:flex;align-items:baseline;gap:8px;margin-top:4px}.afhead b{font:600 34px var(--f-disp);font-variant-numeric:tabular-nums}.afhead span{color:var(--muted)}
.qrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.35}
.qrow input{width:22px;height:22px;flex:none;margin:0;padding:0;accent-color:var(--accent)}
.row .t.wrapt{white-space:normal;overflow:visible}
.code{font:600 30px var(--f-disp);letter-spacing:.14em;text-align:center;font-variant-numeric:tabular-nums}
#lock{position:fixed;inset:0;z-index:1000;background:var(--bg);color:var(--fg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lockbox{width:min(320px,100%);text-align:center}.lockbox .avatar{margin:0 auto 12px}.lockbox h1{margin:0 0 4px;font-size:22px}
.pindots{display:flex;gap:14px;justify-content:center;margin:18px 0 24px}.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);background:transparent}.pindots i.on{background:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}.key{width:68px;height:68px;border-radius:50%;border:0;background:var(--surface);color:var(--fg);font:600 24px/1 inherit;font-family:inherit;cursor:pointer;box-shadow:0 1px 0 var(--line)}.key:active{background:var(--accent-soft)}.key.del{background:transparent;font-size:22px}
</style>
<div class="app"><main id="screen" class="screen"></main></div>
<nav class="tabbar" aria-label="Разделы"><div class="tabs" id="tabs"></div></nav>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

const NB = ' ';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  bolt: '<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>',

  blocks: '<rect x="3" y="12" width="8" height="8" rx="1.5"/><circle cx="17" cy="16" r="4"/><path d="M7 3l4 7H3z"/>',

function debit(accId, amt, tx) {
  const a = acc(accId); if (amt > a.bal) return false;
  a.bal = Math.round((a.bal - amt) * 100) / 100; if (tx) addTx({ ...tx, amt: -amt, acc: a.id }); return true;
}
function credit(accId, amt, tx) {
  const a = acc(accId); a.bal = Math.round((a.bal + amt) * 100) / 100; if (tx) addTx({ ...tx, amt, acc: a.id });
}

}

/* QR */
function qrGrid(seedStr) {
  let h = 2166136261; for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; }, n = 21; let out = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const fin = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    let on; if (fin) { const lx = x % 14 > 6 ? x - 14 : x, ly = y > 13 ? y - 14 : y; on = lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx > 1 && lx < 5 && ly > 1 && ly < 5); } else on = rnd() > 0.52;
    out += `<i class="${on ? '' : 'w'}"></i>`;
  }
  return `<div class="qr" style="grid-template-columns:repeat(${n},1fr)" role="img" aria-label="Демонстрационный QR-код">${out}</div>`;
}
A.qr = () => openSheet('QR', `<div class="seg" style="margin-bottom:12px"><button data-act="qrt" data-arg="my" aria-pressed="true">Мой QR</button><button data-act="qrt" data-arg="pay" aria-pressed="false">Оплатить по QR</button></div><div id="qrb">${qrMy()}</div>`);
const qrMy = () => `${qrGrid('tolqyn-' + main().num)}<p class="center hint">Демонстрационный код. Покажите его, чтобы получить перевод на ${esc(main().name)} •${esc(main().num)}.</p>`;

A.qrt = (m, el) => {

};

/* ---------- встраивание в операции ---------- */
let AFPASS = false, GD = null;

/* --- карточка тревоги на устройстве доверенного лица --- */
function alertCard(r) { return `<section class="card" style="border:1.5px solid var(--bad)"><div class="note" style="margin-bottom:12px;border-color:var(--bad)"><b style="color:var(--bad)">${r.type === 'duress' ? T2('Тихая тревога', 'Үнсіз дабыл') : T2('Вход с нового устройства', 'Жаңа құрылғыдан кіру')}</b></div>
  <p style="margin:0 0 10px">${r.type === 'duress' ? esc(r.victim) + T2(' ввёл(а) PIN под принуждением. Возможно, человека заставляют открыть приложение. Не звоните при посторонних, если можете: напишите или позвоните позже. При угрозе звоните 112.', ' мәжбүрлеу PIN-ін енгізді. Адамды қосымшаны ашуға мәжбүрлеуі мүмкін. Мүмкін болса, бөтен адамдар жанында қоңырау шалмаңыз: жазыңыз немесе кейінірек қоңырау шалыңыз. Қауіп болса, 112-ге қоңырау шалыңыз.') : esc(r.victim) + T2(' вошёл(ла) с нового устройства. Если это не он(а), свяжитесь и попросите выйти на всех устройствах.', ' жаңа құрылғыдан кірді. Егер бұл өзі болмаса, байланысып, барлық құрылғыдан шығуды сұраңыз.')}</p>
  ${rcBlock([[T2('Время', 'Уақыты'), when(r.ts)], r.dev ? [T2('Устройство', 'Құрылғы'), esc(r.dev + (r.city ? ', ' + r.city : ''))] : null])}
  <div class="btns"><button class="btn" data-act="tack" data-arg="${r.id}">${T2('Понял(а)', 'Түсіндім')}</button></div></section>`; }
A.tack = async id => { if (!TRS) return; try { await TX.patchReq(TRS.code, id, { ack: true, by: TRS.name, ts2: Date.now() }); } catch (e) { toast(T2('Не удалось отправить', 'Жіберілмеді')); } };

/* --- центр «Вход и устройства» --- */
const SEVT = { duress: ['Вход под принуждением', 'Мәжбүрлеу PIN-мен кіру'], newdev: ['Вход с нового устройства', 'Жаңа құрылғыдан кіру'], pinfail: ['5 неверных попыток PIN', 'PIN 5 рет қате енгізілді'] };
A.secc = () => {
  const c = S.sec, cur = S.devs.find(d => d.id === S.dev), isNew = cur && !cur.main && Date.now() - cur.ts < DAY;
  const devRows = S.devs.map(d => { const fresh = !d.main && Date.now() - d.ts < DAY; return row({ i: 'user', k: fresh ? 'warn' : 'good', t: d.n + (d.id === S.dev ? ' · ' + T2('это устройство', 'осы құрылғы') : ''), s: d.c + ' · ' + (d.main ? T2('основное', 'негізгі') : fresh ? T2('новое: 24 часа повышенные меры', 'жаңа: 24 сағат күшейтілген шаралар') : T2('известное', 'белгілі')) + ' · ' + when(d.ts) }); }).join('');
  const evs = c.log.slice(0, 5).map(e => row({ i: 'shield', k: 'warn', t: T2(...SEVT[e.t] || ['Событие', 'Оқиға']), s: when(e.ts) })).join('');
  const pinForm = id => `<form data-form="${id}" style="margin-top:10px">${c.pin ? fld({ id: 'cur', label: T2('Текущий PIN', 'Қазіргі PIN'), type: 'password', attrs: 'inputmode="numeric" maxlength="4"' }) : ''}`;
  openSheet(T2('Вход и устройства', 'Кіру және құрылғылар'), `
   ${isNew ? `<div class="note" style="border-color:var(--warn);margin-bottom:12px">${T2('Вы вошли с нового устройства. В течение 24 часов переводы получают повышенную оценку риска.', 'Сіз жаңа құрылғыдан кірдіңіз. 24 сағат бойы аударымдар жоғарылатылған тәуекел бағасын алады.')}</div>` : ''}
   <div class="sec"><h2>${T2('PIN-код', 'PIN-код')}</h2></div>
   <section class="card"><b>${c.pin ? T2('PIN включён', 'PIN қосулы') : T2('PIN не задан', 'PIN орнатылмаған')}</b><p class="hint" style="margin:4px 0 0">${T2('Приложение блокируется после минуты бездействия и при возврате из фона.', 'Қосымша бір минут әрекетсіздіктен кейін және фоннан оралғанда бұғатталады.')}</p>
    ${pinForm('pinset')}${fld({ id: 'pin', label: c.pin ? T2('Новый PIN (4 цифры)', 'Жаңа PIN (4 сан)') : T2('PIN (4 цифры)', 'PIN (4 сан)'), type: 'password', attrs: 'inputmode="numeric" maxlength="4"' })}${fld({ id: 'pin2', label: T2('Повторите PIN', 'PIN-ді қайталаңыз'), type: 'password', attrs: 'inputmode="numeric" maxlength="4"' })}<button class="btn" type="submit">${c.pin ? T2('Сменить PIN', 'PIN ауыстыру') : T2('Включить PIN', 'PIN қосу')}</button></form>
    ${c.pin ? `<div class="btns" style="margin-top:10px"><button class="btn ghost" data-act="lockdemo">${T2('Заблокировать сейчас', 'Қазір бұғаттау')}</button></div>` : ''}</section>
   <div class="sec" style="margin-top:14px"><h2>${T2('PIN под принуждением', 'Мәжбүрлеу PIN-і')}</h2></div>
   <section class="card"><p class="hint" style="margin:0">${T2('Если вас заставляют открыть приложение, введите этот PIN. Приложение откроется, но покажет небольшую сумму, настоящие деньги будут скрыты, а доверенному лицу тихо уйдёт тревога.', 'Сізді қосымшаны ашуға мәжбүрлесе, осы PIN-ді енгізіңіз. Қосымша ашылады, бірақ шағын сома көрсетеді, нақты ақша жасырылады, ал сенімді тұлғаға үнсіз дабыл түседі.')}</p>
    ${c.pin ? `${pinForm('duressset')}${fld({ id: 'dp', label: c.duress ? T2('Новый PIN под принуждением', 'Жаңа мәжбүрлеу PIN-і') : T2('PIN под принуждением (4 цифры)', 'Мәжбүрлеу PIN-і (4 сан)'), type: 'password', attrs: 'inputmode="numeric" maxlength="4"' })}${fld({ id: 'db', label: T2('Сумма, которую увидят (₸)', 'Көрсетілетін сома (₸)'), ph: '15000', val: String(c.dbal || 15000), attrs: 'inputmode="numeric"' })}<button class="btn" type="submit">${c.duress ? T2('Сменить', 'Ауыстыру') : T2('Включить', 'Қосу')}</button></form>` : `<p class="hint" style="margin-top:8px">${T2('Сначала включите обычный PIN.', 'Алдымен әдеттегі PIN-ді қосыңыз.')}</p>`}</section>
   <div class="sec" style="margin-top:14px"><h2>${T2('Устройства', 'Құрылғылар')}</h2></div><section class="card tight">${devRows}</section>
   <div class="btns" style="margin-top:10px"><button class="btn ghost" data-act="devout">${T2('Выйти на всех других устройствах', 'Басқа барлық құрылғыдан шығу')}</button></div>
   ${c.log.length ? `<div class="sec" style="margin-top:14px"><h2>${T2('События безопасности', 'Қауіпсіздік оқиғалары')}</h2></div><section class="card tight">${evs}</section>` : ''}
   <div class="sec" style="margin-top:14px"><h2>${T2('Для демонстрации', 'Көрсету үшін')}</h2></div>
   <div class="btns" style="margin-top:0"><button class="btn ghost" data-act="secdemo">${T2('Быстрая настройка: PIN 1234, принудительный 4321', 'Жылдам баптау: PIN 1234, мәжбүрлеу 4321')}</button>
   <button class="btn ghost" data-act="devnew">${T2('Имитировать вход с нового устройства', 'Жаңа құрылғыдан кіруді имитациялау')}</button>
   <button class="btn ghost" data-act="devmain">${T2('Вернуться на основное устройство', 'Негізгі құрылғыға оралу')}</button>
   <button class="btn ghost" data-act="close">${T2('Закрыть', 'Жабу')}</button></div>`);
};
const pinOk = v => /^\d{4}$/.test(String(v || ''));
const curOk = (d, f) => { const c = S.sec; if (c.pin && pinHash(d.cur || '') !== c.pin) { err(f, T2('Текущий PIN указан неверно', 'Қазіргі PIN қате')); return false; } return true; };
F.pinset = (d, f) => {
  clearErr(f); if (!curOk(d, f)) return; if (!pinOk(d.pin)) return err(f, T2('PIN должен состоять из 4 цифр', 'PIN 4 саннан тұруы керек')); if (d.pin !== d.pin2) return err(f, T2('PIN-коды не совпадают', 'PIN-кодтар сәйкес емес'));
  if (S.sec.duress && pinHash(d.pin) === S.sec.duress) return err(f, T2('PIN не должен совпадать с PIN под принуждением', 'PIN мәжбүрлеу PIN-імен сәйкес болмауы керек'));
  S.sec.pin = pinHash(d.pin); save(); toast(T2('PIN сохранён', 'PIN сақталды')); bump(); A.secc();
};
F.duressset = (d, f) => {
  clearErr(f); if (!curOk(d, f)) return; if (!pinOk(d.dp)) return err(f, T2('PIN должен состоять из 4 цифр', 'PIN 4 саннан тұруы керек')); if (pinHash(d.dp) === S.sec.pin) return err(f, T2('Он должен отличаться от обычного PIN', 'Ол әдеттегі PIN-нен өзгеше болуы керек'));
  const b = parse(d.db); if (b < 0 || b > 100000) return err(f, T2('Сумма от 0 до 100 000 ₸', 'Сома 0-ден 100 000 ₸-ге дейін')); S.sec.duress = pinHash(d.dp); S.sec.dbal = b || 15000; save(); toast(T2('PIN под принуждением включён', 'Мәжбүрлеу PIN-і қосылды')); A.secc();
};
A.lockdemo = () => { closeSheet(); showLock(); };
A.secdemo = () => { S.sec.pin = pinHash('1234'); S.sec.duress = pinHash('4321'); S.sec.dbal = 15000; save(); bump(); toast(T2('PIN 1234, принудительный 4321', 'PIN 1234, мәжбүрлеу 4321')); A.secc(); };
A.devnew = () => {
  let d = S.devs.find(x => !x.main && Date.now() - x.ts < DAY);
  if (!d) { d = { id: 'd' + uid(), n: 'Samsung Galaxy A54', c: 'Астана', ts: Date.now(), last: Date.now() }; S.devs.push(d); slog('newdev', { n: d.n }); }
  S.dev = d.id; save(); secAlert(S, 'newdev'); render(); toast(T2('Вход с нового устройства: 24 часа повышенные меры', 'Жаңа құрылғыдан кіру: 24 сағат күшейтілген шаралар')); A.secc();
};
A.devmain = () => { const m = S.devs.find(d => d.main); if (m) S.dev = m.id; save(); render(); A.secc(); };
A.devout = () => { S.devs = S.devs.filter(d => d.id === S.dev); save(); toast(T2('Другие устройства отключены', 'Басқа құрылғылар ажыратылды')); A.secc(); };

/* --- запуск --- */
if (ROLE === 'client' && S.sec && S.sec.pin) showLock(); else bump();
/* ---------- accounts & cards ---------- */
A.account = id => {
  const a = acc(id), list = S.tx.filter(t => t.acc === id || (!t.acc && id === 'main')).slice(0, 5);
  openSheet(a.name, `<div class="center"><div class="big">${fmt(a.bal)}</div><p class="hint">${a.kind === 'card' ? 'Карта Visa •' + esc(a.num) : 'Текущий счёт KZ' + esc(a.num)}</p></div>
   <div class="btns" style="margin:10px 0 16px"><button class="btn" data-act="topup">Пополнить</button><button class="btn ghost" data-act="own">Между своими счетами</button></div>
   <section class="card tight">${list.map(t => row({ i: CATS[t.cat][1], k: CATS[t.cat][2], t: t.title, s: when(t.ts), r: sgn(t.amt), rc: t.amt > 0 ? 'pos' : '', act: 'txd', arg: t.id })).join('') || '<div class="empty">Операций нет.</div>'}</section>`);
};
A.newcard = () => openSheet('Открыть карту', `<form data-form="newcard">${sel({ id: 'type', label: 'Тип карты', opts: ['Visa Classic', 'Visa Gold', 'Mastercard World'] })}${sel({ id: 'cur', label: 'Валюта', opts: ['KZT'] })}<p class="hint">Виртуальная карта выпускается мгновенно и сразу доступна для оплаты.</p><button class="btn" type="submit">Открыть карту</button></form>`);
F.newcard = d => { const n = String(1000 + Math.floor(Math.random() * 8999)); S.accounts.push({ id: uid(), kind: 'card', name: d.type, num: n, bal: 0 }); done('Карта выпущена', [['Карта', esc(d.type) + ' •' + n], ['Баланс', fmt(0)]], null, '<p class="hint center">Переведите деньги со своей основной карты через «Переводы → На свои счета».</p>'); };
A.newacc = () => openSheet('Текущий счёт', `<form data-form="newacc"><p class="hint">Для валютных операций и социальных выплат. Обслуживание бесплатно.</p>${fld({ id: 'nm', label: 'Название счёта', val: 'Текущий счёт' })}<button class="btn" type="submit">Открыть счёт</button></form>`);
F.newacc = d => { const n = String(Math.floor(1e4 + Math.random() * 8e4)); S.accounts.push({ id: uid(), kind: 'acc', name: d.nm.trim() || 'Текущий счёт', num: n, bal: 0 }); done('Счёт открыт', [['Номер', 'KZ' + n + '…'], ['Баланс', fmt(0)]]); };

/* ---------- cashback, plus ---------- */
const CC = ['food', 'transport', 'pay', 'health', 'shop', 'fx'];
A.cashback = () => openSheet('Кешбэк', `${rcBlock([['Накоплено', fmt(S.cashback)], ['Ставка', S.cashCats.length ? '7% в выбранных, 1% в остальных' : '1% на всё']])}<p class="hint">Выберите до трёх категорий месяца: в них кешбэк 7%.${S.plus ? ' С подпиской Plus ставка удваивается.' : ''}</p>
  <div class="chips" style="flex-wrap:wrap;overflow:visible">${CC.map(c => `<button class="chip" data-act="cashpick" data-arg="${c}" aria-pressed="${S.cashCats.includes(c)}">${CATS[c][0]}</button>`).join('')}</div>
  <div class="btns"><button class="btn" data-act="cashout"${S.cashback < 1000 ? ' disabled' : ''}>Вывести на карту${S.cashback < 1000 ? ' (от 1 000 ₸)' : ''}</button></div>`);
A.cashpick = c => { const i = S.cashCats.indexOf(c); if (i >= 0) S.cashCats.splice(i, 1); else if (S.cashCats.length < 3) S.cashCats.push(c); else toast('Можно выбрать не больше трёх категорий'); save(); render(); A.cashback(); };
A.cashout = () => { const c = S.cashback; if (c < 1000) return; S.cashback = 0; credit(main().id, c, { title: 'Вывод кешбэка', sub: 'На карту', cat: 'cashback' }); done('Кешбэк выведен', [['Новый баланс', fmt(main().bal)]], c); };
A.plus = () => openSheet('Tolqyn Plus', `<div class="note${S.plus ? ' good' : ''}">${S.plus ? 'Подписка активна: кешбэк ×2 и бесплатные переводы.' : 'Кешбэк ×2, бесплатные переводы в другие банки и приоритетная поддержка.'}</div>
  ${rcBlock([['Стоимость', '990 ₸ в месяц'], ['Первый месяц', 'бесплатно']])}<div class="btns">${S.plus ? '<button class="btn danger" data-act="plusoff">Отключить подписку</button>' : '<button class="btn" data-act="pluson">Подключить</button>'}</div>`);
A.pluson = () => { S.plus = true; save(); render(); toast('Подписка Plus подключена'); closeSheet(); };
A.plusoff = () => { S.plus = false; save(); render(); toast('Подписка отключена'); closeSheet(); };

/* ---------- notifications, support, branches, settings ---------- */
A.notes = () => { S.notes.forEach(n => n.r = 1); save(); render(); openSheet('Уведомления', `<section class="card tight">${S.notes.map(n => row({ i: 'bell', t: n.t, s: n.s })).join('')}</section>`); };
const BOT = [[/баланс|сколько/i, () => 'На основной карте ' + fmt(main().bal) + '.'], [/курс|доллар|usd|евро/i, () => 'Сейчас доллар: ' + num(R.USD[0], 2) + ' ₸ (продажа) и ' + num(R.USD[1], 2) + ' ₸ (покупка). Евро: ' + num(R.EUR[0], 2) + ' и ' + num(R.EUR[1], 2) + ' ₸.'], [/лимит/i, () => 'Лимит одного перевода: ' + fmt(LIMIT) + ', одного платежа: 1 000 000 ₸.'], [/кредит|ипотек/i, () => 'Кредит наличными от 22,5%, ипотека от 12%, автокредит от 16%. Заявка в разделе «Вас заинтересует» на главной.'], [/карт.*(блок|потер)|потерял/i, () => 'Если карта утеряна, позвоните по номеру 7 777 (демо). В реальном банке карту блокируют в приложении.'], [/привет|здравств/i, () => 'Здравствуйте! Чем могу помочь?']];
function chatHtml() { return `<div class="chat" id="chat">${S.chat.map(m => `<div class="msg${m.me ? ' me' : ''}">${esc(m.t)}</div>`).join('')}</div><form class="sendrow" data-form="chat"><input id="cm" name="cm" placeholder="Напишите сообщение" autocomplete="off" aria-label="Сообщение"><button class="btn" type="submit">Отправить</button></form>`; }
A.support = () => { openSheet('Связь с банком', chatHtml(), 'Демо-чат с ботом. Ответы шаблонные.'); const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight; };
F.chat = (d, f) => {
  const t = d.cm.trim(); if (!t) return; S.chat.push({ me: 1, t }); const hit = BOT.find(b => b[0].test(t));
  S.chat.push({ me: 0, t: hit ? hit[1]() : 'Передал вопрос оператору. Ответ придёт в чат в течение 15 минут (демо).' }); save();
  $('#sbody').innerHTML = chatHtml(); const c = $('#chat'); c.scrollTop = c.scrollHeight; $('#cm').focus();
};
const BR = [['Отделение на Абая', 'пр. Абая 52, Алматы', '09:00–19:00', '1,2 км'], ['Отделение Dostyk Plaza', 'пр. Достык 111, Алматы', '10:00–20:00', '2,8 км'], ['Банкомат в ТРЦ Mega', 'Розыбакиева 247а, Алматы', 'круглосуточно', '4,1 км'], ['Отделение в Астане', 'ул. Достык 5, Астана', '09:00–18:00', '—']];
A.branches = () => openSheet('Банк на карте', `<div class="note" style="margin-bottom:12px">Демо-список отделений и банкоматов. Реальной карты здесь нет.</div><section class="card tight">${BR.map(b => row({ i: 'pin', t: b[0], s: b[1] + ' · ' + b[2], r: b[3] })).join('')}</section>`);
A.settings = () => openSheet('Настройки', `<form data-form="set">${fld({ id: 'nm', label: 'Ваше имя', val: S.name })}${sel({ id: 'lg', label: 'Язык / Тіл', opts: [['ru', 'Русский'], ['kk', 'Қазақша']], v: S.lang })}<div class="field"><label for="th">Тема оформления</label><select id="th" name="th"><option value="auto">Как в системе</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></div><button class="btn" type="submit">Сохранить</button></form>
  <div class="btns"><button class="btn ghost" data-act="secc">${T2('Вход и устройства', 'Кіру және құрылғылар')}</button><button class="btn ghost" data-act="rolesheet">${T2('Роль в демо', 'Демодағы рөл')}: ${ROLE === 'trusted' ? T2('Доверенное лицо', 'Сенімді тұлға') : T2('Клиент', 'Клиент')}</button><button class="btn danger" data-act="reset">Сбросить демо-данные</button></div>`);
F.set = d => { if (d.nm.trim()) S.name = d.nm.trim(); if (d.lg) S.lang = d.lg; applyLang(); const r = document.documentElement; if (d.th === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', d.th); save(); render(); closeSheet(); toast('Настройки сохранены'); };
A.reset = () => { openSheet('Сбросить данные?', '<p class="sub">Баланс вернётся к 2 000 000 ₸, история и все операции будут очищены.</p><div class="btns"><button class="btn danger" data-act="resetok">Да, сбросить</button><button class="btn ghost" data-act="close">Отмена</button></div>'); };
A.resetok = () => { const lg = S.lang; S = migrate(seed()); S.lang = lg; save(); closeSheet(); render(); toast('Данные сброшены'); };

/* ---------- services ---------- */
A.clean = () => openSheet('Уборка дома', `<form data-form="clean">${sel({ id: 'city', label: 'Город', opts: ['Алматы', 'Астана'] })}${sel({ id: 'kind', label: 'Тип уборки', opts: [['15000', 'Поддерживающая · 15 000 ₸'], ['28000', 'Генеральная · 28 000 ₸'], ['22000', 'После ремонта · 22 000 ₸']] })}${fld({ id: 'adr', label: 'Адрес', ph: 'Улица, дом, квартира' })}<button class="btn" type="submit">Заказать и оплатить</button></form>`);
F.clean = (d, f) => { clearErr(f); if (d.adr.trim().length < 5) return err(f, 'Укажите адрес'); const a = +d.kind; if (!debit(main().id, a, { title: 'Уборка дома', sub: d.city + ' · ' + d.adr, cat: 'other' })) return err(f, 'Недостаточно средств'); done('Заказ принят', [['Город', d.city], ['Адрес', esc(d.adr)], ['Мастер приедет', 'завтра, 10:00']], a); };
A.club = () => openSheet('Private Club', `<div class="note">Закрытый клуб для клиентов с остатком от 5 000 000 ₸ и подпиской Plus.</div>${rcBlock([['Персональный менеджер', 'да'], ['Лаунж-зоны в аэропортах', 'да'], ['Ваш статус', main().bal >= 5e6 && S.plus ? 'Доступен' : 'Пока недоступен']])}`);
const FL = [['Алматы → Астана', 24900], ['Астана → Алматы', 25400], ['Алматы → Стамбул', 118000], ['Астана → Дубай', 142000]];
A.tickets = () => openSheet('Билеты', `<section class="card tight">${FL.map((x, i) => row({ i: 'plane', t: x[0], s: 'Ближайший рейс · ' + new Date(Date.now() + (i + 3) * DAY).toLocaleDateString(LOC()), r: fmt(x[1]), act: 'tkt', arg: String(i) })).join('')}</section>`);
A.tkt = i => { const x = FL[+i]; if (!debit(main().id, x[1], { title: 'Авиабилет: ' + x[0], sub: 'Билет', cat: 'transport' })) return toast('Недостаточно средств'); done('Билет куплен', [['Рейс', x[0]], ['Бронь', 'TQ' + rcpt().slice(0, 5)]], x[1]); };
const OFF = [['Mall Park', 'Скидка 20% на одежду'], ['Kofemania', 'Кофе в подарок при заказе от 3 000 ₸'], ['Sulpak', 'Рассрочка 0-0-12'], ['Chocofood', 'Скидка 70% на первый заказ']];
A.offers = () => openSheet('Предложения партнёров', `<section class="card tight">${OFF.map(o => row({ i: 'tag', k: 'warn', t: o[0], s: o[1] })).join('')}</section>`);
A.junior = () => {
  const l = S.kids.map(k => row({ i: 'kid', t: k.n, s: 'Карта Junior', r: fmt(k.bal), act: 'kidtop', arg: k.id })).join('');
  openSheet('Junior Bank', `${l ? `<section class="card tight">${l}</section>` : '<div class="empty">Детских карт пока нет.</div>'}<form data-form="kid" style="margin-top:12px">${fld({ id: 'n', label: 'Имя ребёнка', ph: 'Алмас' })}<button class="btn" type="submit">Открыть детскую карту</button></form>`);
};
F.kid = (d, f) => { clearErr(f); if (d.n.trim().length < 2) return err(f, 'Введите имя'); S.kids.push({ id: uid(), n: d.n.trim(), bal: 0 }); save(); toast('Карта открыта'); A.junior(); };
A.kidtop = id => { const k = S.kids.find(x => x.id === id); if (S.tx.filter(t => t.title === 'Карманные деньги' && t.ts > Date.now() - DAY).reduce((s, t) => s - t.amt, 0) + 5000 > 50000) return toast('Лимит пополнения детских карт: 50 000 ₸ в сутки'); if (!debit(main().id, 5000, { title: 'Карманные деньги', sub: k.n, cat: 'transfer' })) return toast('Недостаточно средств'); k.bal += 5000; save(); render(); toast('Отправлено 5 000 ₸ → ' + k.n); A.junior(); };
A.docs = () => openSheet('Мои документы', `<section class="card tight">${row({ i: 'doc', t: 'Удостоверение личности', s: 'Данные подтверждены' })}${row({ i: 'doc', t: 'ИИН', s: '•••• •••• 1234' })}${row({ i: 'car', t: 'Водительское удостоверение', s: 'Действует до 2031' })}${S.policies.map(p => row({ i: 'shield', k: 'good', t: 'Полис № ' + p.n, s: 'До ' + new Date(p.end).toLocaleDateString(LOC()) })).join('')}</section><p class="hint" style="margin-top:10px">Демонстрационные записи.</p>`);
A.pledge = () => openSheet('Проверка залога', `<form data-form="pledge">${fld({ id: 'vin', label: 'Госномер или VIN', ph: '123ABC02' })}<button class="btn" type="submit">Проверить</button></form>`);
F.pledge = (d, f) => { clearErr(f); if (d.vin.trim().length < 5) return err(f, 'Введите госномер или VIN'); setSheet('Результат проверки', rcBlock([['Запрос', esc(d.vin.toUpperCase())], ['Обременения', 'Не найдены'], ['Дата проверки', when(Date.now())]]) + '<div class="btns"><button class="btn" data-act="close">Готово</button></div>'); };
A.demoinfo = k => openSheet(k === 'enpf' ? 'Информация по ЕНПФ' : 'Информация по ОСМС', rcBlock(k === 'enpf' ? [['Пенсионные накопления', fmt(1284600)], ['Последний взнос', fmt(14800)], ['Дата взноса', '10 ноября 2026']] : [['Статус', 'Застрахован'], ['Последний взнос', fmt(5950)], ['Действует до', '31 декабря 2026']]) + '<p class="hint">Демо-данные, не из реальных госсистем.</p>');

/* ---------- boot ---------- */
(function init() {
  try { const h = (location.hash || '').slice(1); if (TABS.some(t => t[0] === h)) tab = h; } catch (e) { }
  applyLang(); render();
})();
</script>
